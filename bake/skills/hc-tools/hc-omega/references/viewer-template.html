<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HyperCode 知识图谱</title>
<!--
  hc-omega 图谱查看器模板（自包含、离线、无外部请求）

  用法：把下方 id="hc-graph-data" 的 script 标签内容替换成 JSON 字符串，写成 graph.html。
  该占位符在整个文件中只出现一次，替换时请精确匹配这一个位置。

  数据格式：
    {
      "nodes": [{"id": "文件路径", "label": "标题", "type": "task|decision|architecture|note", "tags": ["标签1"]}],
      "edges": [{"source": "id", "target": "id", "kind": "link|tag"}]
    }

  安全要求：替换前必须 JSON.stringify，并把字符串里的 "<" 转义为 "\u003c"，
  否则笔记内容中的 "</script>" 会提前截断本页脚本。

  容错：若占位符未被替换，页面会显示"无法显示图谱"而不是空白或报错。
-->
<style>
  :root {
    --bg: #0b0e14;
    --panel: #121722;
    --panel-2: #171d2b;
    --line: #232b3d;
    --fg: #dbe3f0;
    --fg-dim: #8494ad;
    --accent: #4ea1ff;
    --tag: #6b7a99;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Hiragino Sans GB", system-ui, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .brand { font-weight: 600; letter-spacing: .3px; white-space: nowrap; }
  .brand span { color: var(--accent); }
  #stats { color: var(--fg-dim); font-size: 12px; white-space: nowrap; }
  .spacer { flex: 1 1 auto; }
  #q {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 7px; padding: 5px 9px; width: 180px; font: inherit; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 7px; padding: 5px 10px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: #fff; }
  .chk { display: inline-flex; align-items: center; gap: 5px; color: var(--fg-dim); cursor: pointer; user-select: none; }

  main { flex: 1 1 auto; display: flex; min-height: 0; }
  #stage { position: relative; flex: 1 1 auto; min-width: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  canvas.on-node { cursor: pointer; }

  aside {
    flex: 0 0 268px; background: var(--panel); border-left: 1px solid var(--line);
    overflow-y: auto; padding: 12px;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--fg-dim); margin: 0 0 8px; font-weight: 600;
  }
  aside section + section { margin-top: 18px; }

  .legend-row {
    display: flex; align-items: center; gap: 7px; padding: 3px 0; cursor: pointer;
    border-radius: 5px;
  }
  .legend-row:hover { background: var(--panel-2); }
  .legend-row.off { opacity: .38; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; }
  .legend-row .n { margin-left: auto; color: var(--fg-dim); font-variant-numeric: tabular-nums; }

  #detail .empty { color: var(--fg-dim); }
  #detail .title { font-weight: 600; word-break: break-word; margin-bottom: 4px; }
  #detail .path { color: var(--fg-dim); font-size: 11px; word-break: break-all; margin-bottom: 8px; }
  #detail .meta { color: var(--fg-dim); margin-bottom: 8px; }
  .tag {
    display: inline-block; background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 1px 8px; margin: 0 4px 4px 0; font-size: 11px;
    color: var(--fg-dim); cursor: pointer;
  }
  .tag:hover { border-color: var(--accent); color: var(--fg); }
  .tag.on { border-color: var(--accent); color: var(--accent); }
  .conn { padding: 3px 0; border-top: 1px solid var(--line); display: flex; gap: 7px; align-items: baseline; }
  .conn .k { color: var(--fg-dim); font-size: 10px; flex: 0 0 auto; }
  .conn .v { word-break: break-word; cursor: pointer; }
  .conn .v:hover { color: var(--accent); }

  #tip {
    position: fixed; pointer-events: none; z-index: 20; max-width: 300px;
    background: #1b2233; border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 9px; font-size: 12px; box-shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  #tip .t { font-weight: 600; word-break: break-word; }
  #tip .s { color: var(--fg-dim); font-size: 11px; margin-top: 2px; }

  #empty {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 30px; color: var(--fg-dim); line-height: 1.9;
  }
  /* ID 选择器的 display 会盖掉浏览器对 hidden 属性的 [hidden]{display:none}，
     必须显式还原，否则这层遮罩会常驻并吞掉画布上的全部鼠标事件。 */
  #empty[hidden] { display: none; }
  #empty .big { color: var(--fg); font-size: 15px; margin-bottom: 6px; }
  footer {
    flex: 0 0 auto; padding: 6px 14px; border-top: 1px solid var(--line);
    color: var(--fg-dim); font-size: 11px; background: var(--panel);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">HyperCode <span>知识图谱</span></div>
    <div id="stats"></div>
    <div class="spacer"></div>
    <input id="q" type="search" placeholder="搜索节点…" autocomplete="off" />
    <button id="reheat" type="button">重排</button>
    <button id="fit" type="button">适应窗口</button>
    <label class="chk"><input type="checkbox" id="physics" checked /> 物理</label>
  </header>

  <main>
    <div id="stage">
      <canvas id="c"></canvas>
      <div id="empty" hidden></div>
    </div>
    <aside>
      <section>
        <h2>类型</h2>
        <div id="legend"></div>
      </section>
      <section>
        <h2>详情</h2>
        <div id="detail"><div class="empty">点击任意节点查看详情。</div></div>
      </section>
    </aside>
  </main>

  <footer id="foot">自包含离线文件 · 由 hc-omega 生成</footer>
</div>

<div id="tip" hidden></div>

<script type="application/json" id="hc-graph-data">__GRAPH_DATA__</script>
<script>
(function () {
  "use strict";

  var TYPE_META = {
    task:         { label: "任务",   color: "#4ea1ff" },
    decision:     { label: "决策",   color: "#f0b429" },
    architecture: { label: "架构",   color: "#3ddc97" },
    note:         { label: "笔记",   color: "#b98cff" }
  };
  var PALETTE = ["#6ec6ff", "#ff8fab", "#ffd166", "#8be9fd", "#c3f584", "#ffa07a"];

  var el = {
    canvas: document.getElementById("c"),
    stage: document.getElementById("stage"),
    stats: document.getElementById("stats"),
    legend: document.getElementById("legend"),
    detail: document.getElementById("detail"),
    tip: document.getElementById("tip"),
    empty: document.getElementById("empty"),
    q: document.getElementById("q"),
    physics: document.getElementById("physics"),
    reheat: document.getElementById("reheat"),
    fit: document.getElementById("fit")
  };

  var typeColor = {};
  function colorOf(type) {
    if (!typeColor[type]) {
      var known = TYPE_META[type];
      typeColor[type] = known ? known.color
        : PALETTE[Object.keys(typeColor).length % PALETTE.length];
    }
    return typeColor[type];
  }
  function labelOf(type) {
    return TYPE_META[type] ? TYPE_META[type].label : type;
  }

  // ---------- load data ----------
  var data = null, problem = null;
  (function () {
    var raw = (document.getElementById("hc-graph-data").textContent || "").trim();
    // 未替换的占位符不是合法 JSON 对象（不以 "{" 开头），据此识别模板未被填充。
    if (!raw || raw.charAt(0) !== "{") {
      problem = "此文件尚未被数据填充。请让 hc-omega 把图谱数据写入模板后再打开。";
      return;
    }
    try { data = JSON.parse(raw); }
    catch (e) { problem = "图谱数据解析失败：" + ((e && e.message) || e); return; }
    if (!data || typeof data !== "object" || !Array.isArray(data.nodes)) {
      problem = "图谱数据格式不正确：缺少 nodes 数组。";
    }
  })();

  function showEmpty(html) {
    el.empty.hidden = false;
    el.empty.innerHTML = html;
    el.canvas.style.visibility = "hidden";
  }

  if (problem) { showEmpty('<div><div class="big">无法显示图谱</div>' + esc(problem) + "</div>"); return; }

  var rawNodes = data.nodes || [];
  var rawEdges = Array.isArray(data.edges) ? data.edges : [];

  if (rawNodes.length === 0) {
    showEmpty('<div><div class="big">知识库还是空的</div>' +
      "先开始工作，我会边做边记录；有了笔记再来看图谱。</div>");
    el.stats.textContent = "0 节点";
    el.legend.innerHTML = "";
    return;
  }

  // ---------- model ----------
  var nodes = rawNodes.map(function (n, i) {
    var type = typeof n.type === "string" && n.type ? n.type : "note";
    return {
      i: i,
      id: String(n.id != null ? n.id : "node-" + i),
      label: String(n.label != null && n.label !== "" ? n.label : n.id != null ? n.id : "节点 " + i),
      type: type,
      tags: Array.isArray(n.tags) ? n.tags.map(String) : [],
      x: 0, y: 0, vx: 0, vy: 0,
      deg: 0, linkDeg: 0, tagDeg: 0
    };
  });

  var byId = {};
  nodes.forEach(function (n) { if (byId[n.id] === undefined) byId[n.id] = n.i; });

  var edges = [];
  rawEdges.forEach(function (e) {
    if (!e) return;
    var s = byId[e.source], t = byId[e.target];
    if (s === undefined || t === undefined || s === t) return;
    var kind = e.kind === "tag" ? "tag" : "link";
    edges.push({ s: s, t: t, kind: kind });
    nodes[s].deg++; nodes[t].deg++;
    if (kind === "link") { nodes[s].linkDeg++; nodes[t].linkDeg++; }
    else { nodes[s].tagDeg++; nodes[t].tagDeg++; }
  });

  var adj = nodes.map(function () { return []; });
  edges.forEach(function (e) { adj[e.s].push(e); adj[e.t].push(e); });

  var types = [];
  nodes.forEach(function (n) { if (types.indexOf(n.type) === -1) types.push(n.type); });
  types.sort();

  // ---------- filters ----------
  var typeOn = {};
  types.forEach(function (t) { typeOn[t] = true; });
  var tagFilter = null;
  var query = "";

  function matches(n) {
    if (!typeOn[n.type]) return false;
    if (tagFilter && n.tags.indexOf(tagFilter) === -1) return false;
    if (query) {
      var hay = (n.label + " " + n.id + " " + n.tags.join(" ")).toLowerCase();
      if (hay.indexOf(query) === -1) return false;
    }
    return true;
  }

  function refreshMatch() {
    for (var i = 0; i < nodes.length; i++) nodes[i].on = matches(nodes[i]);
    draw();
  }

  // ---------- layout (deterministic seed) ----------
  var GOLDEN = Math.PI * (3 - Math.sqrt(5));
  function seed() {
    var n = nodes.length;
    var R = Math.max(140, Math.sqrt(n) * 72);
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 0 : i / (n - 1);
      var r = R * Math.sqrt(t);
      var a = i * GOLDEN;
      nodes[i].x = Math.cos(a) * r;
      nodes[i].y = Math.sin(a) * r;
      nodes[i].vx = 0; nodes[i].vy = 0;
    }
    alpha = 1;
  }

  var REPULSION = 5200;
  var SPRING = 0.014;
  var SPRING_TAG = 0.004;
  var LINK_LEN = 78;
  var TAG_LEN = 190;
  var CENTER = 0.0016;
  var DAMPING = 0.85;
  var alpha = 1;

  function simulate() {
    var i, j, a, b, dx, dy, d2, d, f, ux, uy, n = nodes.length;

    for (i = 0; i < n; i++) {
      a = nodes[i];
      for (j = i + 1; j < n; j++) {
        b = nodes[j];
        dx = b.x - a.x; dy = b.y - a.y;
        d2 = dx * dx + dy * dy;
        if (d2 < 1e-4) { dx = 0.31 + (i % 3) * 0.07; dy = 0.17 + (j % 3) * 0.05; d2 = dx * dx + dy * dy; }
        d = Math.sqrt(d2);
        f = (REPULSION / d2) * alpha;
        ux = dx / d; uy = dy / d;
        a.vx -= ux * f; a.vy -= uy * f;
        b.vx += ux * f; b.vy += uy * f;
      }
    }

    for (i = 0; i < edges.length; i++) {
      var e = edges[i];
      a = nodes[e.s]; b = nodes[e.t];
      dx = b.x - a.x; dy = b.y - a.y;
      d = Math.sqrt(dx * dx + dy * dy) || 1e-3;
      var rest = e.kind === "tag" ? TAG_LEN : LINK_LEN;
      var k = e.kind === "tag" ? SPRING_TAG : SPRING;
      f = k * (d - rest) * alpha;
      ux = dx / d; uy = dy / d;
      a.vx += ux * f; a.vy += uy * f;
      b.vx -= ux * f; b.vy -= uy * f;
    }

    for (i = 0; i < n; i++) {
      a = nodes[i];
      a.vx -= a.x * CENTER * alpha;
      a.vy -= a.y * CENTER * alpha;
      a.vx *= DAMPING; a.vy *= DAMPING;
      a.x += a.vx; a.y += a.vy;
    }

    alpha *= 0.994;
    if (alpha < 0.02) alpha = 0;
  }

  // ---------- view ----------
  var view = { x: 0, y: 0, k: 1 };
  var dpr = 1, W = 0, H = 0;

  function resize() {
    dpr = window.devicePixelRatio || 1;
    W = el.stage.clientWidth;
    H = el.stage.clientHeight;
    el.canvas.width = Math.max(1, Math.round(W * dpr));
    el.canvas.height = Math.max(1, Math.round(H * dpr));
    draw();
  }

  function radiusOf(n) { return 4.5 + Math.min(9, Math.sqrt(n.deg) * 2.1); }

  function fit() {
    if (!nodes.length) return;
    var minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    nodes.forEach(function (n) {
      if (n.x < minX) minX = n.x; if (n.x > maxX) maxX = n.x;
      if (n.y < minY) minY = n.y; if (n.y > maxY) maxY = n.y;
    });
    var pad = 70;
    var w = Math.max(1, maxX - minX), h = Math.max(1, maxY - minY);
    var k = Math.min((W - pad * 2) / w, (H - pad * 2) / h);
    view.k = Math.max(0.12, Math.min(2.4, k));
    view.x = W / 2 - ((minX + maxX) / 2) * view.k;
    view.y = H / 2 - ((minY + maxY) / 2) * view.k;
    draw();
  }

  var ctx = el.canvas.getContext("2d");

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    ctx.save();
    ctx.translate(view.x, view.y);
    ctx.scale(view.k, view.k);

    var i, e, a, b, hot;

    for (i = 0; i < edges.length; i++) {
      e = edges[i];
      a = nodes[e.s]; b = nodes[e.t];
      hot = selected !== null && (e.s === selected || e.t === selected);
      var dim = (searching && !(a.on && b.on)) ? 0.07 : (searching ? 0.9 : 0.5);
      if (e.kind === "tag") {
        ctx.strokeStyle = "rgba(107,122,153," + (hot ? 0.85 : dim * 0.62) + ")";
        ctx.setLineDash([4, 5]);
        ctx.lineWidth = (hot ? 1.6 : 1) / view.k;
      } else {
        ctx.strokeStyle = "rgba(78,161,255," + (hot ? 0.9 : dim) + ")";
        ctx.setLineDash([]);
        ctx.lineWidth = (hot ? 1.9 : 1) / view.k;
      }
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);

    for (i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var r = radiusOf(n);
      var faded = searching && !n.on;
      ctx.globalAlpha = faded ? 0.16 : 1;

      if (selected === i) {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 6 / view.k, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(78,161,255,0.16)";
        ctx.fill();
      }

      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
      ctx.fillStyle = colorOf(n.type);
      ctx.fill();
      if (selected === i) {
        ctx.lineWidth = 2 / view.k;
        ctx.strokeStyle = "#fff";
        ctx.stroke();
      }

      if (view.k > 0.55 && !faded) {
        ctx.font = (11 / view.k) + "px 'PingFang SC','Microsoft YaHei',sans-serif";
        ctx.fillStyle = "rgba(219,227,240,0.82)";
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        var text = n.label.length > 16 ? n.label.slice(0, 15) + "…" : n.label;
        ctx.fillText(text, n.x, n.y + r + 3 / view.k);
      }
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  var searching = false;
  var selected = null;
  var hovered = null;

  function toWorld(cx, cy) {
    return { x: (cx - view.x) / view.k, y: (cy - view.y) / view.k };
  }

  function pick(cx, cy) {
    var p = toWorld(cx, cy);
    var best = null, bestD = Infinity;
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      var dx = n.x - p.x, dy = n.y - p.y;
      var d2 = dx * dx + dy * dy;
      var r = radiusOf(n) + 6;
      if (d2 <= r * r && d2 < bestD) { bestD = d2; best = i; }
    }
    return best;
  }

  // ---------- pointer ----------
  var drag = null;

  el.canvas.addEventListener("mousedown", function (ev) {
    var rect = el.canvas.getBoundingClientRect();
    var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    var hit = pick(cx, cy);
    if (hit !== null) {
      drag = { node: hit, moved: false };
      el.canvas.classList.add("dragging");
    } else {
      drag = { pan: true, sx: cx, sy: cy, ox: view.x, oy: view.y };
      el.canvas.classList.add("dragging");
    }
  });

  window.addEventListener("mousemove", function (ev) {
    var rect = el.canvas.getBoundingClientRect();
    var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;

    if (drag && drag.node !== undefined) {
      var w = toWorld(cx, cy);
      var n = nodes[drag.node];
      n.x = w.x; n.y = w.y; n.vx = 0; n.vy = 0;
      drag.moved = true;
      alpha = Math.max(alpha, 0.32);
      draw();
      return;
    }
    if (drag && drag.pan) {
      if (Math.abs(cx - drag.sx) + Math.abs(cy - drag.sy) > 2) drag.moved = true;
      view.x = drag.ox + (cx - drag.sx);
      view.y = drag.oy + (cy - drag.sy);
      draw();
      return;
    }

    if (cx < 0 || cy < 0 || cx > W || cy > H) { hideTip(); el.canvas.classList.remove("on-node"); hovered = null; return; }

    var hit = pick(cx, cy);
    hovered = hit;
    if (hit === null) { hideTip(); el.canvas.classList.remove("on-node"); return; }
    el.canvas.classList.add("on-node");
    var n = nodes[hit];
    el.tip.hidden = false;
    el.tip.innerHTML = '<div class="t">' + esc(n.label) + "</div>" +
      '<div class="s">' + esc(labelOf(n.type)) + " · 连接 " + n.deg +
      (n.tags.length ? " · #" + esc(n.tags.join(" #")) : "") + "</div>";
    el.tip.style.left = Math.min(window.innerWidth - 310, ev.clientX + 14) + "px";
    el.tip.style.top = Math.min(window.innerHeight - 70, ev.clientY + 14) + "px";
  });

  window.addEventListener("mouseup", function () {
    if (drag && drag.node !== undefined && !drag.moved) select(drag.node);
    else if (drag && drag.pan && !drag.moved) select(null);
    drag = null;
    el.canvas.classList.remove("dragging");
  });

  el.canvas.addEventListener("wheel", function (ev) {
    ev.preventDefault();
    var rect = el.canvas.getBoundingClientRect();
    var cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    var p = toWorld(cx, cy);
    var factor = Math.pow(1.0016, -ev.deltaY);
    var k = Math.max(0.1, Math.min(4, view.k * factor));
    view.k = k;
    view.x = cx - p.x * k;
    view.y = cy - p.y * k;
    draw();
  }, { passive: false });

  function hideTip() { el.tip.hidden = true; }

  // ---------- panels ----------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildLegend() {
    el.legend.innerHTML = "";
    types.forEach(function (t) {
      var count = nodes.filter(function (n) { return n.type === t; }).length;
      var row = document.createElement("div");
      row.className = "legend-row" + (typeOn[t] ? "" : " off");
      row.setAttribute("role", "button");
      row.setAttribute("tabindex", "0");
      row.innerHTML = '<span class="dot" style="background:' + colorOf(t) + '"></span>' +
        "<span>" + esc(labelOf(t)) + '</span><span class="n">' + count + "</span>";
      row.addEventListener("click", function () {
        typeOn[t] = !typeOn[t];
        row.className = "legend-row" + (typeOn[t] ? "" : " off");
        refreshMatch();
      });
      el.legend.appendChild(row);
    });
  }

  function select(i) {
    selected = i;
    draw();
    if (i === null) {
      el.detail.innerHTML = '<div class="empty">点击任意节点查看详情。</div>';
      return;
    }
    var n = nodes[i];
    var html = '<div class="title">' + esc(n.label) + "</div>" +
      '<div class="path">' + esc(n.id) + "</div>" +
      '<div class="meta">' + esc(labelOf(n.type)) + " · 连接 " + n.deg +
      "（链接 " + n.linkDeg + " / 标签 " + n.tagDeg + "）</div>";

    if (n.tags.length) {
      html += '<div style="margin-bottom:8px">' + n.tags.map(function (t) {
        return '<span class="tag' + (tagFilter === t ? " on" : "") + '" data-tag="' + esc(t) + '">#' + esc(t) + "</span>";
      }).join("") + "</div>";
      if (tagFilter) html += '<div style="margin-bottom:8px"><span class="tag on" data-tag="">清除标签筛选</span></div>';
    }

    var conns = adj[i].map(function (e) {
      var other = e.s === i ? e.t : e.s;
      return { n: nodes[other], kind: e.kind };
    }).sort(function (a, b) {
      if (a.kind !== b.kind) return a.kind === "link" ? -1 : 1;
      return a.n.label.localeCompare(b.n.label, "zh-Hans-CN");
    }).slice(0, 60);

    html += "<h2>连接（" + adj[i].length + "）</h2>";
    if (!conns.length) html += '<div class="empty">没有连线。</div>';
    conns.forEach(function (c) {
      html += '<div class="conn"><span class="k">' + (c.kind === "link" ? "链接" : "标签") +
        '</span><span class="v" data-node="' + c.n.i + '">' + esc(c.n.label) + "</span></div>";
    });

    el.detail.innerHTML = html;

    el.detail.querySelectorAll("[data-tag]").forEach(function (node) {
      node.addEventListener("click", function () {
        var t = node.getAttribute("data-tag");
        tagFilter = t === "" ? null : t;
        searching = !!(query || tagFilter);
        refreshMatch();
        select(i);
      });
    });
    el.detail.querySelectorAll("[data-node]").forEach(function (node) {
      node.addEventListener("click", function () {
        select(parseInt(node.getAttribute("data-node"), 10));
      });
    });
  }

  // ---------- controls ----------
  el.q.addEventListener("input", function () {
    query = el.q.value.trim().toLowerCase();
    searching = !!(query || tagFilter);
    refreshMatch();
  });
  el.reheat.addEventListener("click", function () { seed(); });
  el.fit.addEventListener("click", fit);
  el.physics.addEventListener("change", function () {
    if (el.physics.checked) alpha = Math.max(alpha, 0.55);
  });

  window.addEventListener("resize", resize);
  window.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") { select(null); el.q.value = ""; query = ""; tagFilter = null; searching = false; refreshMatch(); }
  });

  // ---------- boot ----------
  seed();
  // 先让布局收敛再取景：否则打开文件后节点会继续漂移、跑出视野。
  // 迭代次数随节点数下降，避免大知识库在启动时卡顿。
  var warmup = Math.min(250, Math.max(30, Math.round(60000 / Math.max(1, nodes.length))));
  for (var w = 0; w < warmup; w++) simulate();
  buildLegend();
  resize();
  el.stats.textContent = nodes.length + " 节点 · " + edges.length + " 连线";
  refreshMatch();
  fit();

  var frames = 0;
  (function loop() {
    if (el.physics.checked && alpha > 0) { simulate(); draw(); }
    else if (frames < 3) { draw(); frames++; }
    requestAnimationFrame(loop);
  })();

  // 只读自检入口：供自动化测试与排障读取当前状态，不改变任何行为。
  window.__hcGraph = {
    nodeCount: nodes.length,
    edgeCount: edges.length,
    types: types,
    selected: function () { return selected; },
    visibleCount: function () { return nodes.filter(matches).length; },
    screenOf: function (i) { return { x: view.x + nodes[i].x * view.k, y: view.y + nodes[i].y * view.k }; }
  };
})();
</script>
</body>
</html>
