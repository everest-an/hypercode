name: typecheck

# 用 ubuntu-latest 而不用上游的 blacksmith-* 标签：本仓是个人帐号下的公开仓库，
# 没有也无法安装 Blacksmith（它只支持组织），那些 job 会永远排队而不执行。
# 公开仓库的 GitHub-hosted runner 免费不限量，此处无需换回。
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Run typecheck
        run: bun typecheck
