name: diag-linux-build

# 一次性诊断（用完即删）。
#
# 已知：
#   - Linux 上直接 `bun run build`（packages/app）→ 成功（✓ built in 28.10s）
#   - CI 的 unit job 里 `bun turbo test` → @opencode-ai/app#build 失败
#       Could not resolve "./gen/types.gen.js" from "packages/sdk/js/src/v2/client.ts"
#   - 已排除：bun 版本、Vite 缓存、缺生成文件、Vite alias
#
# 本轮隔离 turbo 路径与 GITHUB_ACTIONS=false 这两个变量。

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: A) 对照：直接构建 packages/app（已知成功）
        continue-on-error: true
        run: |
          cd packages/app
          bun run build > /tmp/a.log 2>&1
          echo "A exit=$?"
          tail -3 /tmp/a.log

      - name: B) turbo 全量构建（不设 GITHUB_ACTIONS）
        continue-on-error: true
        run: |
          set +e
          bun turbo run build > /tmp/b.log 2>&1
          echo "B exit=$?"
          echo "--- 失败特征 ---"
          grep -iE 'Could not resolve|error during build|Failed:|exited with code' /tmp/b.log | head -12 || echo "(无)"
          echo "--- 结尾 ---"
          tail -6 /tmp/b.log

      - name: C) turbo 全量构建（GITHUB_ACTIONS=false，与 CI 同）
        continue-on-error: true
        run: |
          set +e
          GITHUB_ACTIONS=false bun turbo run build > /tmp/c.log 2>&1
          echo "C exit=$?"
          echo "--- 失败特征 ---"
          grep -iE 'Could not resolve|error during build|Failed:|exited with code' /tmp/c.log | head -12 || echo "(无)"
          echo "--- 结尾 ---"
          tail -6 /tmp/c.log

      - name: D) turbo 只构建 app
        continue-on-error: true
        run: |
          GITHUB_ACTIONS=false bun turbo run build --filter=@opencode-ai/app > /tmp/d.log 2>&1
          echo "D exit=$?"
          grep -iE 'Could not resolve|error during build|Failed:|exited with code|Packages in scope|No tasks' /tmp/d.log | head -12 || echo "(无)"
          tail -6 /tmp/d.log
