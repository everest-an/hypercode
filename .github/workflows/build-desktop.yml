name: build-desktop
run-name: "build-desktop ${{ inputs.version || 'snapshot' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (optional)"
        required: false
        type: string
      notarize:
        description: "Notarize the macOS build (a first notarization can take many hours)"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - dev
    paths:
      - "packages/desktop/**"
      - "packages/tui/**"
      - "packages/ui/**"
      - "packages/opencode/**"

permissions:
  contents: read

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Windows PowerShell 5.1 decodes a .ps1 as ANSI unless it carries a UTF-8 BOM, so any script with
      # non-ASCII text (every installer script here has Chinese messages) fails to parse for real users
      # while looking perfectly fine in an editor. Both bake/pair.ps1 and script/setup-apple-signing.ps1
      # were written that way. The installers run on user machines and have no test suite of their own,
      # so this gate has to exist here.
      - name: Assert every PowerShell script parses under Windows PowerShell
        shell: powershell
        run: |
          $failed = @()
          Get-ChildItem -Path . -Recurse -File -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch '\\node_modules\\|\\plugin-payload\\|\\dist\\|\\out\\' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $failed += "$($_.FullName): $($errors[0].Message) (line $($errors[0].Extent.StartLineNumber))"
              }
            }
          if ($failed.Count -gt 0) { $failed | ForEach-Object { Write-Host "::error::$_" }; exit 1 }
          Write-Host "all PowerShell scripts parse"

      - name: Setup Node (native installs)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install

      - name: Prebuild (embedded server + icons)
        working-directory: packages/desktop
        run: bun run prebuild
        env:
          OPENCODE_CHANNEL: prod

      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod
          NODE_OPTIONS: "--max-old-space-size=8192"

      # Pre-installs the orchestration plugin into resources/plugin so the shipped app never has to download
      # it. Must run per-platform and before packaging: the payload keeps only this runner's native binaries,
      # and electron-builder decides whether to include it by checking the directory at config load.
      - name: Bundle plugin payload
        working-directory: packages/desktop
        run: bun ./scripts/bundle-plugin.ts

      - name: Package Windows (NSIS installer)
        working-directory: packages/desktop
        run: bun run package:win -- --publish never
        env:
          OPENCODE_CHANNEL: prod
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # Stamps the installer with the version actually being released. Empty on push builds, where
          # electron-builder falls back to packages/desktop/package.json (kept in sync with /VERSION).
          HYPERCODE_VERSION: ${{ inputs.version }}

      # extraResources fails quietly: a wrong from:, a filter matching nothing, or an asar pattern
      # swallowing a directory all yield a green build and a smaller installer. Assert it is really there.
      - name: Verify packaged payload
        working-directory: packages/desktop
        run: bun ./scripts/verify-package.ts dist/win-unpacked/resources

      # latest.yml is the update manifest electron-updater fetches from the newest release. Shipping only the
      # installer is why every version so far reported "Cannot find latest.yml ... 404" on launch and could
      # never update itself: users had to notice a new build existed and reinstall by hand.
      #
      # It has to be in the release the client updates *to*, not the one it is running, so adding it here
      # also rescues the already-installed versions that lack it.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hypercode-desktop-windows
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest.yml
          if-no-files-found: error

  build-mac:
    runs-on: macos-15
    env:
      APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (native installs)
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: "package.json"

      - name: Install dependencies
        run: bun install

      - name: Prebuild (embedded server + icons)
        working-directory: packages/desktop
        run: bun run prebuild
        env:
          OPENCODE_CHANNEL: prod

      - name: Build
        working-directory: packages/desktop
        run: bun run build
        env:
          OPENCODE_CHANNEL: prod
          # macos-latest is an Apple Silicon runner with only 7 GB of RAM. A heap
          # cap above physical memory stops V8 from applying back-pressure, so the
          # build hangs instead of failing cleanly. Keep this at 4096.
          NODE_OPTIONS: "--max-old-space-size=4096"

      # A release without Apple credentials is not "an unsigned release", it is a broken one: on Apple
      # Silicon an unsigned arm64 Mach-O is refused outright, so the dmg installs and then the app will
      # not open. Fail here instead of shipping it, and only for release builds -- push builds stay
      # artifact-only and may legitimately lack credentials.
      - name: Require Apple credentials for release builds
        if: inputs.version != '' && env.APPLE_ID_SECRET == ''
        run: |
          echo "::error::Release build requested but APPLE_ID secret is missing. Add MAC_CERT_P12_BASE64," \
               "MAC_CERT_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID first."
          exit 1

      - name: Configure signing (only when Apple credentials exist)
        if: env.APPLE_ID_SECRET != ''
        run: |
          echo "HC_SIGN=1" >> "$GITHUB_ENV"
          echo "HC_NOTARIZE=${{ inputs.notarize == true && '1' || '0' }}" >> "$GITHUB_ENV"
          echo "CSC_LINK=${{ secrets.MAC_CERT_P12_BASE64 }}" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CERT_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
          echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"

      # Both macOS architectures are built here rather than in a matrix: a second macOS runner bills at 10x,
      # and the only per-arch work is the plugin payload plus the electron-builder pass itself. The payload
      # must be re-pruned between them -- it carries native binaries, so the arm64 tree cannot ship in the
      # Intel installer. Ordering matters too: electron-builder decides whether to include resources/plugin
      # when it loads its config, so each bundle step has to precede its own package step.
      - name: Bundle plugin payload (arm64)
        working-directory: packages/desktop
        run: bun ./scripts/bundle-plugin.ts --platform darwin --arch arm64

      - name: Package macOS Apple Silicon (dmg + zip)
        working-directory: packages/desktop
        run: bun run package:mac -- --arm64 --publish never
        env:
          OPENCODE_CHANNEL: prod
          # Do NOT set CSC_IDENTITY_AUTO_DISCOVERY here. With "false", findIdentity() returns null
          # before it ever consults the imported certificate, so codesign never runs, notarization is
          # skipped with it, and electron-builder still exits 0. (The Windows job keeps its "false":
          # that platform signs through a custom signtool callback instead, which is unaffected.)
          HYPERCODE_VERSION: ${{ inputs.version }}

      # The pipeline used to treat "skipped signing" as a warning with exit 0, so a green build proved
      # nothing. These assertions are the proof: an unsigned arm64 app cannot execute on Apple Silicon,
      # and stapler validate is the only check that proves notarization actually stapled.
      - name: Assert macOS Apple Silicon is signed
        if: env.APPLE_ID_SECRET != ''
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          APP="dist/mac-arm64/HyperCode.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$HC_NOTARIZE" = "1" ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$APP"
          fi

      - name: Bundle plugin payload (x64)
        working-directory: packages/desktop
        run: bun ./scripts/bundle-plugin.ts --platform darwin --arch x64

      - name: Package macOS Intel (dmg + zip)
        working-directory: packages/desktop
        run: bun run package:mac -- --x64 --publish never
        env:
          OPENCODE_CHANNEL: prod
          # See the Apple Silicon step: auto-discovery stays enabled so the imported certificate is used.
          HYPERCODE_VERSION: ${{ inputs.version }}

      - name: Assert macOS Intel is signed
        if: env.APPLE_ID_SECRET != ''
        working-directory: packages/desktop
        run: |
          set -euo pipefail
          APP="dist/mac/HyperCode.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$HC_NOTARIZE" = "1" ]; then
            spctl --assess --type execute -vv "$APP"
            xcrun stapler validate "$APP"
          fi

      # See the Windows job.
      - name: Verify packaged payload (arm64)
        working-directory: packages/desktop
        run: bun ./scripts/verify-package.ts "dist/mac-arm64/HyperCode.app/Contents/Resources"

      # The Intel build lands in dist/mac (no -x64 suffix) and was previously never verified at all,
      # so a broken x64 payload could ship on the strength of the arm64 check alone.
      - name: Verify packaged payload (x64)
        working-directory: packages/desktop
        run: bun ./scripts/verify-package.ts "dist/mac/HyperCode.app/Contents/Resources"

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: hypercode-desktop-macos
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
          if-no-files-found: error

  # Assembles the installers into a *draft* release on the public download repo. Draft is the point: the
  # product rule is that a build is validated internally before anyone can download it, so publishing stays a
  # deliberate human action. Until then the assets are fetchable only by repo collaborators.
  #
  # Only runs when a version was supplied by hand, so the push-to-dev builds stay artifact-only.
  #
  # Requires a RELEASE_TOKEN secret: GITHUB_TOKEN is scoped to this repository and the downloads live in
  # another one (AwareLiquid/HyperCode). It needs contents:write on that repo and nothing else.
  draft-release:
    needs: [build-win, build-mac]
    if: inputs.version != ''
    runs-on: ubuntu-latest
    steps:
      # Fetch the release-notes body FIRST. This job otherwise only downloads artifacts, and checkout@v4's
      # `clean: false` is unreliable here: in practice it can still wipe the working tree (we've seen it
      # `Deleting the contents of .../hypercode` then re-init). If that happened *after* Download installers,
      # it deletes the 600 MB dist/ the next step just filled, and Create draft release then fails with
      # "no matches found". Sparse + clean: false is kept because the body is the only file needed, but
      # the ordering is what makes it safe: checkout runs against an empty workspace, so even a clean wipe
      # cannot remove the installers that are downloaded afterwards.
      - name: Fetch the release notes body
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          clean: false

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify the expected assets exist
        run: |
          cd dist
          ls -la
          missing=0
          # The blockmap is what lets an update fetch only the changed blocks. Without it electron-updater
          # logs "Cannot download differentially, fallback to full download" and pulls the whole ~190 MB
          # installer every time - which still works, so its absence is invisible except in the logs.
          for f in hypercode-desktop-win-x64.exe hypercode-desktop-mac-arm64.dmg hypercode-desktop-mac-x64.dmg latest.yml hypercode-desktop-win-x64.exe.blockmap; do
            if [ ! -f "$f" ]; then echo "::error::missing asset $f"; missing=1; fi
          done
          # A manifest naming a file that is not in the release updates nobody: electron-updater resolves
          # `path` against the release assets and 404s, which is indistinguishable from having no manifest at
          # all. Both names come from electron-builder's artifactName, so they can only drift by accident --
          # which is exactly the kind of drift that ships unnoticed.
          if [ -f latest.yml ]; then
            named=$(sed -n 's/^path: *//p' latest.yml | tr -d '\r')
            echo "latest.yml points at: ${named:-<none>}"
            if [ -z "$named" ] || [ ! -f "$named" ]; then
              echo "::error::latest.yml names '$named', which is not among the uploaded assets"
              missing=1
            fi
          fi
          # A zero-byte or few-KB "installer" is the failure mode worth catching here: it uploads without
          # complaint and 404-page-as-exe looks identical to the real thing in a release listing.
          for f in *.exe *.dmg; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 50000000 ]; then echo "::error::$f is only $size bytes"; missing=1; fi
          done
          exit $missing

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="v${VERSION#v}"
          # Recreate rather than append, so a re-run cannot leave assets from a previous attempt behind.
          gh release delete "$tag" --repo AwareLiquid/HyperCode --yes --cleanup-tag 2>/dev/null || true
          # latest.yml lets Windows clients update themselves; without it electron-updater 404s and every
          # release has to be installed by hand. macOS is deliberately not covered yet: it needs the .zip
          # assets plus a latest-mac.yml merged across the two per-architecture packaging passes, which
          # overwrite each other, and none of that can be verified from here. Shipping an untested update
          # manifest is worse than shipping none, so mac keeps updating manually until it can be tested on a
          # mac.
          # The download page links here for the macOS one-time authorization step, so this body has to
          # carry it. Kept in .github/release-notes.md rather than inline: prose belongs in a file that can
          # be read and edited, and a step that depends on someone remembering to paste it is the step that
          # gets skipped.
          {
            printf 'Desktop installers for Windows and macOS. Built from everest-an/hypercode@%s.\n\n' "${GITHUB_SHA:0:7}"
            cat "$GITHUB_WORKSPACE/.github/release-notes.md"
          } > notes.md
          gh release create "$tag" \
            --repo AwareLiquid/HyperCode \
            --draft \
            --title "HyperCode $tag" \
            --notes-file notes.md \
            dist/hypercode-desktop-win-x64.exe \
            dist/hypercode-desktop-mac-arm64.dmg \
            dist/hypercode-desktop-mac-x64.dmg \
            dist/latest.yml \
            dist/hypercode-desktop-win-x64.exe.blockmap
          echo "::notice::Draft release $tag created. Verify the installers, then publish it to go live."
