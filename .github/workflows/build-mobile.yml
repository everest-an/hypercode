name: build-mobile

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "EXPO_PUBLIC_API_URL baked into the app (public workbench server origin)"
        required: true
        type: string
      upload:
        description: "Upload the .ipa to App Store Connect (TestFlight)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@9

      - name: Install workbench dependencies
        working-directory: workbench
        run: pnpm install --no-frozen-lockfile

      - name: Prebuild the iOS project
        working-directory: workbench/apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: workbench/apps/mobile/ios
        run: pod install --repo-update

      - name: Import signing material
        env:
          IOS_CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/ios.keychain"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$IOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security import "$RUNNER_TEMP/ios.p12" -k "$KEYCHAIN" -P "$IOS_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$HOME/Library/MobileDevice/Provisioning Profiles/hypercode-mobile.mobileprovision"

      - name: Build the archive
        working-directory: workbench/apps/mobile/ios
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
        run: |
          set -euo pipefail
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          PROJECT=$(ls -d *.xcodeproj | head -n 1)
          SCHEME="${PROJECT%.xcodeproj}"
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/HyperCodeRemote.xcarchive" archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" PROVISIONING_PROFILE_SPECIFIER="HyperCode Remote App Store" DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          echo "--- archive contents ---"
          find "$RUNNER_TEMP/HyperCodeRemote.xcarchive" -maxdepth 3 | head -n 20
          test -d "$RUNNER_TEMP/HyperCodeRemote.xcarchive/Products/Applications"

      - name: Export the .ipa
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/HyperCodeRemote.xcarchive"
          python3 -c 'import os,plistlib; o={"method":"app-store-connect","teamID":os.environ["APPLE_TEAM_ID"],"signingStyle":"manual","provisioningProfiles":{"app.hypercode.mobile":"HyperCode Remote App Store"},"uploadSymbols":True,"destination":"export"}; open(os.path.join(os.environ["RUNNER_TEMP"],"ExportOptions.plist"),"wb").write(plistlib.dumps(o))'
          cat "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates
          ls -la "$RUNNER_TEMP/export"

      - name: Upload the .ipa as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: hypercode-mobile-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to App Store Connect
        if: inputs.upload == true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios -u "$APPLE_ID" -p "$APPLE_APP_SPECIFIC_PASSWORD" --verbose
