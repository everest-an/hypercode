<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" fill="currentColor" shape-rendering="crispEdges">
  <!-- HyperCode mark: bold MIT-style chevrons + circular porthole. 25x25 grid, 10px cells. -->
  <!-- left chevron < (2-cell bold, 11 tall) -->
  <rect x="60" y="70" width="20" height="10"/><rect x="50" y="80" width="20" height="10"/><rect x="40" y="90" width="20" height="10"/><rect x="30" y="100" width="20" height="10"/><rect x="20" y="110" width="20" height="10"/><rect x="10" y="120" width="20" height="10"/><rect x="20" y="130" width="20" height="10"/><rect x="30" y="140" width="20" height="10"/><rect x="40" y="150" width="20" height="10"/><rect x="50" y="160" width="20" height="10"/><rect x="60" y="170" width="20" height="10"/>
  <!-- circular porthole O (pixel donut) -->
  <rect x="120" y="90" width="10" height="10"/><rect x="120" y="100" width="10" height="10"/><rect x="120" y="140" width="10" height="10"/><rect x="120" y="150" width="10" height="10"/>
  <rect x="110" y="100" width="10" height="10"/><rect x="110" y="110" width="10" height="10"/><rect x="110" y="130" width="10" height="10"/><rect x="110" y="140" width="10" height="10"/>
  <rect x="130" y="100" width="10" height="10"/><rect x="130" y="110" width="10" height="10"/><rect x="130" y="130" width="10" height="10"/><rect x="130" y="140" width="10" height="10"/>
  <rect x="100" y="110" width="10" height="10"/><rect x="100" y="120" width="10" height="10"/><rect x="100" y="130" width="10" height="10"/>
  <rect x="140" y="110" width="10" height="10"/><rect x="140" y="120" width="10" height="10"/><rect x="140" y="130" width="10" height="10"/>
  <rect x="90" y="120" width="10" height="10"/><rect x="150" y="120" width="10" height="10"/>
  <!-- right chevron > (2-cell bold, 11 tall) -->
  <rect x="170" y="70" width="20" height="10"/><rect x="180" y="80" width="20" height="10"/><rect x="190" y="90" width="20" height="10"/><rect x="200" y="100" width="20" height="10"/><rect x="210" y="110" width="20" height="10"/><rect x="220" y="120" width="20" height="10"/><rect x="210" y="130" width="20" height="10"/><rect x="200" y="140" width="20" height="10"/><rect x="190" y="150" width="20" height="10"/><rect x="180" y="160" width="20" height="10"/><rect x="170" y="170" width="20" height="10"/>
</svg>
